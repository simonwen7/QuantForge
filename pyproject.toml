[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quantforge"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "duckdb>=1.4,<2.0",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]
api = [
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "pydantic>=2,<3",
    "uvicorn>=0.32,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/quantforge"]
